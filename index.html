<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>후~ 케이크 · 롤링페이퍼 레터링 케이크</title>
<meta name="description" content="레터링 문구와 토핑으로 직접 꾸미는 3D 생일 케이크. 친구들이 롤링페이퍼를 숨기고, 폰 마이크에 후~ 불면 촛불이 꺼지며 쪽지가 열려요.">
<meta name="theme-color" content="#0B0820">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
:root { --sub: rgba(255,255,255,.72); --glass: rgba(255,255,255,.09); --edge: rgba(255,255,255,.32); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0820; color: #fff; font-family: 'Gothic A1', -apple-system, system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }

/* 리퀴드 글래스: 흐림 + 채도 + 가장자리 빛 + 위쪽 반사 */
.glass { position: relative; background: var(--glass); backdrop-filter: blur(18px) saturate(1.8); -webkit-backdrop-filter: blur(18px) saturate(1.8); border-radius: 28px; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12), inset 0 0 0 1px var(--edge), 0 18px 40px rgba(0,0,0,.35); overflow: hidden; }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.12) 100%); pointer-events: none; }

.top { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 20px); transform: translateX(-50%); width: min(88vw, 380px); padding: 14px 20px 16px; text-align: center; }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .28em; color: #FFD8A8; }
.title { margin: 6px 0 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.25; word-break: keep-all; }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--sub); }
.count { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.14); }

.dock { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); width: min(92vw, 400px); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.field { flex: 1; min-width: 0; border: 0; border-radius: 18px; padding: 14px 16px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); font-size: 16px; outline: none; resize: none; }
.field::placeholder { color: rgba(255,255,255,.5); }
.field.age { flex: 0 0 90px; text-align: center; }
.field.letter { font-family: 'Jua', sans-serif; font-size: 18px; text-align: center; line-height: 1.35; padding: 10px 14px; }
.pill { position: relative; height: 52px; flex: 1; border: 0; border-radius: 999px; font-size: 16px; font-weight: 800; cursor: pointer; background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.3); transition: transform .15s; white-space: nowrap; }
.pill.main { background: linear-gradient(135deg, rgba(255,170,110,.85), rgba(255,95,150,.85)); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 10px 30px rgba(255,110,140,.4); }
.pill.mini { flex: 0 0 auto; padding: 0 16px; }
.pill.seg { height: 40px; font-size: 14px; }
.pill.seg[aria-pressed=true] { background: rgba(255,255,255,.34); box-shadow: inset 0 0 0 2px #fff; }
.pill:active { transform: scale(.97); }
.chips { display: flex; gap: 8px; justify-content: center; }
.chip { width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.chip[aria-pressed=true] { box-shadow: 0 0 0 3px #fff, 0 0 14px rgba(255,255,255,.6); }
.parts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 2px 14px; }
.parts::-webkit-scrollbar { display: none; }
.part { flex: none; width: 54px; height: 54px; border: 0; border-radius: 18px; font-size: 26px; cursor: pointer; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.part[aria-pressed=true] { background: rgba(255,255,255,.3); box-shadow: inset 0 0 0 2px #fff, 0 0 16px rgba(255,255,255,.45); }
.small { border: 0; background: none; color: var(--sub); font-size: 13px; padding: 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.meter { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8FD3FF, #FFD8A8); border-radius: 99px; transition: width .08s; }

.sheet { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(8,5,25,.35); }
.card { width: min(90vw, 360px); padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px; }
.note-read { font-family: 'Gowun Dodum', sans-serif; font-size: 20px; line-height: 1.6; white-space: pre-wrap; word-break: keep-all; min-height: 80px; }
.from { font-family: 'Jua', sans-serif; font-size: 18px; text-align: right; opacity: .9; }
.card > .pill, .dock > .pill { flex: none; } /* 세로 배치에서 flex:1이면 버튼 높이가 눌린다 */
.paper button { white-space: nowrap; }
.check { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: #FF7FA8; }
.card.wide { width: min(94vw, 560px); max-height: calc(100dvh - 40px); }
.wall { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; columns: 150px 2; column-gap: 10px; }
.paper { break-inside: avoid; margin: 0 0 10px; padding: 14px; border-radius: 16px; color: #4A3B5C; font-family: 'Gowun Dodum', sans-serif; font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.paper .who { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; font-family: 'Jua', sans-serif; color: #7A5C8F; }
.paper button { border: 0; background: none; color: #7A5C8F; font-size: 13px; padding: 2px; cursor: pointer; text-decoration: underline; }
.empty { text-align: center; color: var(--sub); padding: 24px 0; }
.toast { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section class="glass top">
  <div class="kicker">HAPPY BIRTHDAY</div>
  <h1 class="title" id="title">누구의 생일이야?</h1>
  <p class="hint" id="hint">이름·나이를 넣고 케이크를 꾸며 봐</p>
  <span class="count" id="count" hidden></span>
</section>

<section class="glass dock" id="setup">
  <div class="row">
    <input class="field" id="nm" maxlength="8" placeholder="생일인 친구 이름" aria-label="생일인 친구 이름">
    <input class="field age" id="ag" inputmode="numeric" maxlength="2" placeholder="나이" aria-label="나이">
  </div>
  <div class="row" id="shapes" role="group" aria-label="케이크 모양">
    <button class="pill seg" data-s="heart" aria-pressed="true">💗 하트</button>
    <button class="pill seg" data-s="round" aria-pressed="false">🎂 원형</button>
  </div>
  <div class="chips" id="flavors" role="group" aria-label="케이크 색"></div>
  <button class="pill main" id="next">✨ 케이크 꾸미러 가기</button>
</section>

<section class="glass dock" id="deco" hidden>
  <textarea class="field letter" id="letter" rows="2" maxlength="30" aria-label="레터링 문구"></textarea>
  <div class="chips" id="inks" role="group" aria-label="글씨 색"></div>
  <div class="parts" id="parts" role="group" aria-label="토핑 고르기"></div>
  <div class="row"><button class="pill mini" id="undo" aria-label="되돌리기">↩️</button><button class="pill main" id="finish">🕯️ 완성! 촛불 켜기</button></div>
</section>

<section class="glass dock" id="play" hidden>
  <div class="meter" aria-hidden="true"><i id="lvl"></i></div>
  <div class="row"><button class="pill" id="write">✍️ 롤링페이퍼 쓰기</button><button class="pill main" id="mic">🎤 후~ 불기</button></div>
  <div class="row" style="justify-content:center;flex-wrap:wrap;gap:2px 14px">
    <button class="small" id="tap">마이크가 안 되면 여기를 꾹</button>
    <button class="small" id="all">💌 모아 보기</button>
    <button class="small" id="pass">🔗 링크 보내기</button>
    <button class="small" id="gift" hidden>🎁 주인공 링크</button>
  </div>
</section>

<section class="glass dock" id="done" hidden>
  <button class="pill main" id="all2">💌 쪽지 모아 보기</button>
  <div class="row"><button class="pill" id="pass2">🔗 링크 보내기</button><button class="pill" id="relight">🕯️ 다시 켜기</button></div>
  <button class="small" id="mine">🎂 나도 만들기</button>
</section>

<div class="sheet" id="writeSheet" hidden>
  <div class="glass card">
    <h2>✍️ 롤링페이퍼 숨기기</h2>
    <textarea class="field" id="msg" rows="4" maxlength="80" placeholder="생일 축하 한마디&#10;촛불을 끄면 열려요 🤫" aria-label="축하 메시지"></textarea>
    <div class="row"><input class="field" id="from" maxlength="8" placeholder="보내는 사람" aria-label="보내는 사람"></div>
    <div class="chips" id="papers" role="group" aria-label="쪽지 색"></div>
    <label class="check" id="secretRow" hidden><input type="checkbox" id="secret"> 🔒 주인공만 보기</label>
    <div class="row"><button class="pill" id="wNo">취소</button><button class="pill main" id="wOk">케이크에 쏙</button></div>
  </div>
</div>
<div class="sheet" id="readSheet" hidden>
  <div class="glass card">
    <div class="note-read" id="rText"></div>
    <div class="from" id="rFrom"></div>
    <button class="pill" id="rClose">닫기</button>
  </div>
</div>
<div class="sheet" id="allSheet" hidden>
  <div class="glass card wide">
    <h2 id="allTitle"></h2>
    <div class="wall" id="wall"></div>
    <button class="pill" id="allClose">닫기</button>
  </div>
</div>
<div class="sheet" id="linkSheet" hidden>
  <div class="glass card">
    <h2>🎉 케이크 완성! 링크는 두 개예요</h2>
    <button class="pill main" id="lFriend">💌 친구용 링크 보내기</button>
    <p class="hint">단톡방에 올리면 친구들이 쪽지를 남겨요.</p>
    <button class="pill" id="lOwner">🎁 주인공 전용 링크 보내기</button>
    <p class="hint">생일날 주인공에게만 보내 주세요. 비밀 쪽지까지 열리는 링크예요.</p>
    <input class="field" id="lUrl" readonly hidden aria-label="복사할 링크">
    <button class="small" id="lClose">닫기</button>
  </div>
</div>
<div class="glass toast" id="toast" role="status"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const $ = (id) => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const CAPTURE = QS.has('capture'); // 영상 녹화용: window.__step으로 한 프레임씩
if (CAPTURE && QS.has('clean')) document.head.insertAdjacentHTML('beforeend', '<style>.top,.dock,.toast{visibility:hidden!important}</style>'); // 3D만 찍기
let seed = 7;
const rnd = CAPTURE ? () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } : Math.random;

const FLAVORS = { pink: '#FFC9DA', mint: '#C3EEDB', lavender: '#DCCBFF', butter: '#FFE6A3' };
const INKS = ['#F0628F', '#8A68EE', '#23A97E', '#E8962E', '#5A4470'];
const PAPERS = ['#FFF4B8', '#FFD6E5', '#D3F2FF', '#E2FFD6', '#EBDDFF'];
const MAX_PARTS = 24;

// ---------- 상태 (링크 하나에 다 담김) ----------
const S = { mode: 'setup', name: '', age: 0, shape: 'heart', flavor: 'pink', ink: INKS[0], letter: '', parts: [], notes: [], sel: 'cherry', paper: 0,
  blow: 0, forced: 0, allOut: false, outAt: 0, revealed: false, time: 0, intro: 0, lighting: -1, dim: 0 };
const enc = (o) => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = (s) => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0))));
const josa = (n) => (/[가-힣]$/.test(n) && (n.charCodeAt(n.length - 1) - 0xAC00) % 28 ? '아' : '야');
const r2 = (v) => Math.round(v * 100) / 100;
const defaultLetter = () => `${S.name}${josa(S.name)}\n생일 축하해 ♡`;
const cakeData = () => ({ n: S.name, a: S.age, s: S.shape, f: S.flavor, i: S.ink, l: S.letter, p: S.parts.map((p) => [p.t, r2(p.x), r2(p.z)]) });
function saveHash() { // 예전 방식(#d=) 링크 전용. 서버 케이크는 주소에 쪽지를 담지 않는다
  history.replaceState(null, '', '#d=' + enc({ ...cakeData(), m: S.notes.map((x) => [x.from, x.text, x.c]) }));
}

// ---------- 쪽지 저장소 (Supabase, 설정은 setup.sql) ----------
const DB_URL = 'https://bbbikxyjdcoxbnusehrb.supabase.co';
const DB_KEY = 'sb_publishable_BlYF9_mIebs_J3mJ6SHcxw_GB_esE_y'; // 공개용 키. 쓰기·읽기는 setup.sql의 함수로만 가능
async function rpc(fn, args) {
  const r = await fetch(`${DB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: DB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const LOCKED = '🔒 주인공만 읽을 수 있는 비밀 쪽지예요';
const mapNotes = (list) => list.map((x) => ({ id: x.id, from: String(x.from).slice(0, 8), text: x.text == null ? null : String(x.text).slice(0, 200), c: PAPERS.includes(x.c) ? x.c : PAPERS[0], secret: !!x.secret }));
const friendLink = () => `${location.origin}${location.pathname}#c=${S.cake}`;
const ownerLink = () => `${friendLink()}&k=${S.maker}`;
// 만든 사람이 전용 링크를 다시 꺼낼 수 있게 이 기기에만 기억해 둔다
const makerStore = { get: (id) => { try { return localStorage.getItem('hucake:' + id); } catch { return null; } }, set: (id, k) => { try { localStorage.setItem('hucake:' + id, k); } catch {} } };

// ---------- 렌더러·장면 ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, CAPTURE ? 3 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#2B1752'); gr.addColorStop(0.55, '#170D33'); gr.addColorStop(1, '#0A061C');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog(0x0E0824, 13, 28);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = 13;
controls.minPolarAngle = 0.3; controls.maxPolarAngle = 1.4;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;

const hemi = new THREE.HemisphereLight(0xC9B8FF, 0x1A0F33, 0.7); scene.add(hemi);
const key = new THREE.DirectionalLight(0xFFE8D2, 1.1);
key.position.set(3, 8, 6); key.castShadow = true; key.shadow.mapSize.set(1536, 1536); key.shadow.radius = 6;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9F8BFF, 1.1); rim.position.set(-5, 3, -6); scene.add(rim);
const glow = new THREE.PointLight(0xFFB066, 0, 8, 1.6); glow.position.set(0, 2.6, -0.3); scene.add(glow);
const BASE = { hemi: 0.7, key: 1.1, rim: 1.1, env: 0.5 }; // 불 끌 때 어두워졌다가 다시 밝아짐

// ---------- 텍스처 ----------
function radial(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  stops.forEach(([p, col]) => gr.addColorStop(p, col)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX_FLAME = radial([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(255,214,140,.9)'], [0.6, 'rgba(255,140,60,.3)'], [1, 'rgba(255,90,30,0)']]);
const TEX_SOFT = radial([[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']]);
const TEX_SMOKE = radial([[0, 'rgba(225,220,240,.8)'], [0.5, 'rgba(195,190,215,.35)'], [1, 'rgba(160,155,190,0)']]);
const stripes = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 64, 256);
  g.fillStyle = '#FFB3CB'; for (let y = -64; y < 320; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(64, y + 28); g.lineTo(64, y + 44); g.lineTo(0, y + 16); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  if (conf.visible) {
    cp.forEach((c, i) => {
      c.v.y -= 9.8 * dt * 0.45; c.v.multiplyScalar(1 - dt * 1.6); c.p.x += Math.sin(t * 2 + i) * dt * 0.25;
      c.p.addScaledVector(c.v, dt);
      if (c.p.y < TABLE_Y + 0.02) { c.p.y = TABLE_Y + 0.02; c.v.set(0, 0, 0); c.w.multiplyScalar(0.9); }
      c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt;
      co.position.copy(c.p); co.rotation.copy(c.r); co.updateMatrix(); conf.setMatrixAt(i, co.matrix);
    });
    conf.instanceMatrix.needsUpdate = true;
  }
  bokeh.rotation.y = t * 0.02;
  composer.render(dt);
}

// ---------- 버튼 ----------
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
async function share(url, text) {
  try { if (navigator.share) { await navigator.share({ title: '후~ 케이크', text, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('링크 복사 완료! 카톡에 붙여넣기 💌'); }
  catch { $('linkSheet').hidden = false; const u = $('lUrl'); u.hidden = false; u.value = url; u.select(); toast('공유가 막혀 있어요. 링크를 길게 눌러 복사해 주세요'); }
}
const friendText = () => `${S.name} 생일 롤링페이퍼 💌 한 장 남겨 줘! 주인공한테는 비밀이야 🤫`;
async function pass() {
  if (S.cake) return share(friendLink(), friendText());
  saveHash();
  return share(location.href, S.notes.length ? `${S.name} 생일 롤링페이퍼 💌 ${S.notes.length}장 모였어! 너도 한 장 숨기고 다음 사람한테 넘겨 줘` : `${S.name} 생일 케이크 🎂 롤링페이퍼 한 장 숨겨 줘!`);
}
function openLinks() { $('lUrl').hidden = true; $('lOwner').hidden = !S.maker; $('linkSheet').hidden = false; }
async function refreshNotes() { // 다른 친구가 그사이 쓴 쪽지까지 다시 받아 온다
  const r = await rpc('get_cake', { p_id: S.cake, p_key: S.ownerKey });
  const before = S.notes.map((n) => n.id).join();
  S.notes = mapNotes(r.notes); setTitle();
  if (S.notes.map((n) => n.id).join() !== before) { clearNotes(); S.notes.forEach((n) => addNote3d(n, false)); }
}
function paperEl(n) { // 친구가 쓴 글은 textContent로만 넣는다
  const el = document.createElement('div'); el.className = 'paper'; el.style.background = n.c;
  el.append(n.text ?? LOCKED);
  const who = document.createElement('div'); who.className = 'who'; who.textContent = `${n.secret ? '🔒 ' : ''}from. ${n.from}`;
  if (S.ownerKey && n.id != null) {
    const del = document.createElement('button'); del.textContent = '지우기';
    del.onclick = async () => {
      if (!confirm('이 쪽지를 지울까요? 되돌릴 수 없어요.')) return;
      try { await rpc('delete_note', { p_id: S.cake, p_key: S.ownerKey, p_note: n.id }); await openAll(); } catch { toast('지우지 못했어요. 다시 해 주세요'); }
    };
    who.append(del);
  }
  el.append(who); return el;
}
async function openAll() {
  if (S.cake) try { await refreshNotes(); } catch { toast('최신 쪽지를 불러오지 못했어요'); }
  $('allTitle').textContent = `💌 ${S.name}에게 온 쪽지 ${S.notes.length}장`;
  if (S.notes.length) $('wall').replaceChildren(...S.notes.map(paperEl));
  else { const e = document.createElement('p'); e.className = 'empty'; e.textContent = '아직 쪽지가 없어요'; $('wall').replaceChildren(e); }
  $('allSheet').hidden = false;
}
$('next').onclick = () => {
  S.name = $('nm').value.trim() || '친구'; S.age = Math.max(1, Math.min(99, parseInt($('ag').value, 10) || 1));
  S.notes = []; S.letter = ''; clearNotes(); goDeco();
};
$('letter').addEventListener('input', (e) => { S.letter = e.target.value.split('\n').slice(0, 3).join('\n'); drawLettering(); });
$('undo').onclick = () => { if (!S.parts.length) return; S.parts.pop(); deco.remove(deco.children[deco.children.length - 1]); };
$('finish').onclick = async () => {
  if (CAPTURE) { saveHash(); return openCake(); } // 영상 녹화는 서버 없이
  $('finish').disabled = true;
  try {
    const r = await rpc('create_cake', { p_data: cakeData() });
    S.cake = r.id; S.maker = r.key; makerStore.set(r.id, r.key);
    history.replaceState(null, '', '#c=' + r.id); // 전용 키는 주소창에 남기지 않는다
    await openCake(); openLinks();
  } catch { toast('저장에 실패했어요. 다시 눌러 주세요'); }
  $('finish').disabled = false;
};
$('write').onclick = () => { $('msg').value = ''; $('secret').checked = false; $('writeSheet').hidden = false; $('msg').focus(); };
$('wNo').onclick = () => { $('writeSheet').hidden = true; };
$('wOk').onclick = async () => {
  const text = $('msg').value.trim(); if (!text) return toast('한마디 써 줘!');
  const n = { from: $('from').value.trim() || '익명', text, c: PAPERS[S.paper], secret: !!S.cake && $('secret').checked };
  if (S.cake) { // 저장에 실패하면 쓴 글이 날아가지 않게 창을 닫지 않는다
    $('wOk').disabled = true;
    try { n.id = await rpc('add_note', { p_id: S.cake, p_from: n.from, p_text: text, p_color: n.c, p_secret: n.secret }); }
    catch (e) { toast(e.message.includes('cake_full') ? '쪽지가 200장으로 가득 찼어요' : '저장에 실패했어요. 다시 눌러 주세요'); return; }
    finally { $('wOk').disabled = false; }
  }
  S.notes.push(n); $('writeSheet').hidden = true; if (!S.cake) saveHash(); setTitle();
  await addNote3d(n, true);
  toast('케이크 속에 쏙! 촛불을 끄면 열려요 🤫');
};
$('rClose').onclick = () => { $('readSheet').hidden = true; };
$('mic').onclick = startMic;
const hold = (on) => () => { S.forced = on ? 0.9 : 0; if (on) ac = ac || new AudioContext(); };
$('tap').addEventListener('pointerdown', hold(true)); $('tap').addEventListener('pointerup', hold(false)); $('tap').addEventListener('pointerleave', hold(false));
$('pass').onclick = $('pass2').onclick = pass;
$('all').onclick = $('all2').onclick = openAll;
$('allClose').onclick = () => { $('allSheet').hidden = true; };
$('gift').onclick = openLinks;
$('lFriend').onclick = pass;
$('lOwner').onclick = () => share(ownerLink(), `${S.name}${josa(S.name)}, 생일 축하해! 🎂 친구들이 쪽지를 숨겨 놨어. 촛불을 후~ 불어 봐`);
$('lClose').onclick = () => { $('linkSheet').hidden = true; };
$('relight').onclick = () => openCake();
$('mine').onclick = () => {
  history.replaceState(null, '', location.pathname); S.cake = null; S.maker = null; S.ownerKey = null; S.notes = []; S.parts = []; S.letter = ''; clearNotes(); deco.clear();
  candles.forEach((c) => cake.remove(c.g)); candles = []; conf.visible = false; $('nm').value = ''; $('ag').value = '';
  $('title').textContent = '누구의 생일이야?'; $('hint').textContent = '이름·나이를 넣고 케이크를 꾸며 봐'; $('count').hidden = true; camGoal = TO; lookGoal = LOOK; show('setup');
};

// 누르기: 꾸미기 중엔 토핑 붙이기, 아니면 쪽지 읽기 (드래그로 돌린 건 무시)
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  if (S.mode === 'deco') { const hit = ray.intersectObject(topDisk)[0]; if (hit) { const p = cake.worldToLocal(hit.point.clone()); placePart(p.x, p.z); } return; }
  const hit = ray.intersectObjects(notes3d.filter((m) => m.visible), true)[0]; if (!hit) return;
  const n = hit.object.parent.userData.n; $('rText').textContent = n.text ?? LOCKED; $('rFrom').textContent = `from. ${n.from}`; $('readSheet').hidden = false;
});

// 링크로 열면 꾸민 케이크 + 숨은 쪽지 그대로 (#c=서버 케이크, #d=예전 링크)
function applyCake(o) {
  S.name = String(o.n || '친구').slice(0, 8); S.age = +o.a || 1; S.shape = o.s === 'round' ? 'round' : 'heart';
  S.flavor = FLAVORS[o.f] ? o.f : 'pink'; S.ink = INKS.includes(o.i) ? o.i : INKS[0]; S.letter = String(o.l || '').slice(0, 30);
  S.parts = (o.p || []).slice(0, MAX_PARTS).filter(([t]) => PARTS[t]).map(([t, x, z]) => ({ t, x: +x || 0, z: +z || 0 }));
}
const HASH = new URLSearchParams(location.hash.slice(1));
try {
  const c = HASH.get('c'), d = HASH.get('d');
  if (c) {
    $('setup').hidden = true; $('title').textContent = '케이크 불러오는 중…'; $('hint').textContent = '';
    const r = await rpc('get_cake', { p_id: c, p_key: HASH.get('k') });
    if (!r) throw new Error('not found');
    applyCake(r.data); S.cake = c; S.ownerKey = r.owner ? HASH.get('k') : null; S.maker = makerStore.get(c); S.notes = mapNotes(r.notes);
  } else if (d) {
    const o = dec(d); applyCake(o);
    S.notes = (o.m || []).slice(0, 40).map(([from, text, c]) => ({ from: String(from).slice(0, 8), text: String(text).slice(0, 80), c: PAPERS.includes(c) ? c : PAPERS[0] }));
  }
} catch {
  $('setup').hidden = false; $('title').textContent = '누구의 생일이야?'; $('hint').textContent = '이름·나이를 넣고 케이크를 꾸며 봐';
  toast('케이크를 불러오지 못했어요. 링크를 확인해 주세요');
}
buildCake();
if (S.name) { $('shapes').querySelectorAll('[data-s]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.s === S.shape)); S.notes.forEach((n) => addNote3d(n, false)); openCake(); }

if (CAPTURE) {
  window.__step = (dt = 1 / 30) => step(dt);
  window.__blow = (v) => { S.forced = v; };
  window.__setup = (name, age, flavor, shape = 'heart') => { $('nm').value = name; $('ag').value = String(age); S.flavor = flavor; S.shape = shape; buildCake(); };
  window.__next = () => $('next').click();
  window.__letter = (text, ink) => { $('letter').value = text; S.letter = text; if (ink) S.ink = ink; drawLettering(); };
  window.__part = (t, x, z) => { S.sel = t; placePart(x, z); };
  window.__finish = () => $('finish').click();
  window.__note = (from, text, c) => { const n = { from, text, c }; S.notes.push(n); setTitle(); return addNote3d(n, true); };
  window.__ready = true;
} else {
  let last = performance.now();
  renderer.setAnimationLoop((now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); });
}
</script>
</body>
</html>
